<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0 p-4">

                <h1 class="fw-bold mb-3">{{ post.title }}</h1>
                <p class="text-muted mb-4">
                    By <span class="badge bg-secondary">{{ post.author }}</span> on {{ post.created_at|date:"M d, Y - h:i A" }}
                </p>

                <!-- പോസ്റ്റിൽ ചിത്രമുണ്ടെങ്കിൽ ഇവിടെ കാണിക്കും -->
                {% if post.image %}
                    <img src="{{ post.image.url }}" class="img-fluid rounded mb-4 shadow-sm" alt="{{ post.title }}" style="max-height: 400px; width: 100%; object-fit: cover;">
                {% endif %}

                <p class="lead" style="line-height: 1.8;">{{ post.content }}</p>

                <hr class="my-4">

                <div class="d-flex justify-content-between">
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary">← Back to Home</a>
                    <div>
                        <a href="{% url 'post_edit' post.id %}" class="btn btn-warning">✏️ Edit</a>
                        <a href="{% url 'post_delete' post.id %}" class="btn btn-danger">🗑️ Delete</a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

</body>
</html>
